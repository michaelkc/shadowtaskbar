[package]
name = "shadowtaskbar-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shadowtaskbar-rs"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
winres = "0.1"
